name: "RPi OLED Monitor"
version: "0.0.3"
description: "Display system info on a connected i2c OLED display"
url: "https://github.com/jxctn0/homeassistant-rpi-oled"
homeassistant_api: true
slug: rpi_oled
full_access: true
startup: application
boot: auto
arch:
    - aarch64
devices:
    - /dev/i2c-0:rw
    - /dev/i2c-1:rw
    - /dev/i2c-2:rw
    - /dev/i2c-3:rw
    - /dev/i2c-4:rw
    - /dev/i2c-5:rw
    - /dev/i2c-6:rw
options:
    bus_number: 1
    i2c_address: "0x3C"
    sensor_cpu_temp: sensor.system_monitor_processor_temperature
    sensor_cpu_use: sensor.system_monitor_processor_use
    sensor_ram_use: sensor.system_homeassistant_glances_memory_use
    sensor_ram_free: sensor.system_homeassistant_glances_memory_free
    sensor_disk_use: sensor.system_homeassistant_glances_data_disk_size
    sensor_disk_free: sensor.system_homeassistant_glances_data_disk_used
    sensor_net_tx: sensor.system_homeassistant_glances_hassio_tx
    sensor_net_rx: sensor.system_homeassistant_glances_hassio_rx
schema:
    bus_number: int
    i2c_address: str
    sensor_cpu_temp: device
    sensor_cpu_use: device
    sensor_ram_use: device
    sensor_ram_free: device
    sensor_disk_use: device
    sensor_disk_free: device
    sensor_net_tx: device
    sensor_net_rx: device
